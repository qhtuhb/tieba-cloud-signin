name: 百度贴吧每日签到
on:
  schedule:
    # UTC 22:30 = 北京时间次日 06:30。GitHub 调度可能延迟。
    - cron: '30 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tieba-daily-sign
  cancel-in-progress: false
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 测试解析与凭证安全处理
        run: python -m unittest -v
      - name: 签到全部关注贴吧
        env:
          TIEBA_COOKIE: ${{ secrets.TIEBA_COOKIE }}
          TIEBA_REPORT_DIR: reports
        run: python -u sign.py
      - name: 保存签到详情
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tieba-sign-report
          path: reports/
          retention-days: 30
          if-no-files-found: warn
