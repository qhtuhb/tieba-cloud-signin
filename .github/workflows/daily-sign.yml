name: 百度贴吧每日签到
on:
  schedule:
    # UTC 01:00 = 北京时间 09:00。GitHub 调度可能延迟。
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tieba-daily-sign
  cancel-in-progress: false
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 测试解析与凭证安全处理
        run: python -m unittest -v
      - name: 签到全部关注贴吧
        env:
          TIEBA_COOKIE: ${{ secrets.TIEBA_COOKIE }}
        run: python sign.py
